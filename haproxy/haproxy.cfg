global
    log stdout format raw local0
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 666 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 3000ms
    timeout client  30000ms
    timeout server  30000ms

frontend http_front
    bind *:80
    default_backend app_servers

backend app_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server server_a server_a:5001 check inter 1000ms fall 2 rise 2
    server server_b server_b:5002 check inter 1000ms fall 2 rise 2 backup
    server server_c server_c:5003 check inter 1000ms fall 2 rise 2 backup

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 3s
    stats admin if TRUE
